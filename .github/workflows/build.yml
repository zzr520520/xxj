name: Build DEB Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Theos
        uses: wwg135/theos-action@v1

      - name: Build rootless package
        run: |
          export THEOS=${{ github.workspace }}/theos
          chmod 0755 layout/DEBIAN/* || true
          make clean THEOS=$THEOS
          make package FINALPACKAGE=1 THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWiper-Rootless-DEB
          path: ${{ github.workspace }}/packages/*.deb

      - name: Commit deb to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*.deb || true
          if git diff --cached --quiet; then
            echo "No deb to commit"
          else
            git commit -m "CI: Auto-build AppWiper rootless deb [skip ci]"
            git push
          fi