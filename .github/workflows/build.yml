name: Build DEB & TIPA Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Theos
        uses: wwg135/theos-action@v1

      - name: Install ldid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libplist-dev libssl-dev libxml2-dev zlib1g-dev build-essential
          git clone --depth=1 https://github.com/xerub/ldid.git /tmp/ldid-build 2>/dev/null || true
          if [ -d /tmp/ldid-build ]; then
            cd /tmp/ldid-build
            g++ -std=c++11 -o ldid ldid.cpp -I. -x c lookup2.c -lplist -lcrypto -lxml2 -lz 2>&1 || echo "ldid compile failed"
            if [ -f ldid ]; then
              sudo cp ldid /usr/local/bin/ldid
              sudo chmod +x /usr/local/bin/ldid
              echo "ldid installed"
            fi
          fi
          if ! command -v ldid &> /dev/null; then
            echo "Trying prebuilt ldid..."
            curl -sL "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64" -o /tmp/ldid 2>/dev/null || true
            if [ -s /tmp/ldid ]; then
              sudo cp /tmp/ldid /usr/local/bin/ldid
              sudo chmod +x /usr/local/bin/ldid
              echo "ldid prebuilt installed"
            fi
          fi
          command -v ldid && echo "ldid OK" || echo "ldid NOT available"

      - name: Build rootless package
        run: |
          export THEOS=${{ github.workspace }}/theos
          chmod 0755 layout/DEBIAN/* || true
          make clean THEOS=$THEOS
          make package FINALPACKAGE=1 THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless

      - name: Package TIPA
        run: |
          export THEOS=${{ github.workspace }}/theos
          APP_PATH=""
          if [ -d ".theos/_/Applications/AppWiperUI.app" ]; then
            APP_PATH=".theos/_/Applications/AppWiperUI.app"
          elif [ -d "layout/Applications/AppWiperUI.app" ]; then
            APP_PATH="layout/Applications/AppWiperUI.app"
          else
            APP_PATH=$(find .theos -name "AppWiperUI.app" -type d 2>/dev/null | grep -v ".dSYM" | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: AppWiperUI.app not found!"
            find . -name "*.app" -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH/"

          INFO_PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist missing!"
            exit 1
          fi
          echo "Info.plist OK"
          file "$INFO_PLIST"

          # 二进制plist转XML
          if file "$INFO_PLIST" | grep -qi "binary"; then
            echo "Converting binary plist to XML..."
            python3 -c "import plistlib; f=open('$INFO_PLIST','rb'); d=plistlib.load(f); f.close(); f=open('$INFO_PLIST','wb'); plistlib.dump(d,f,fmt=plistlib.FMT_XML); f.close(); print('done')" || echo "plist convert warning"
            file "$INFO_PLIST"
          fi

          # 验证plist关键字段
          python3 -c "import plistlib; p=plistlib.load(open('$INFO_PLIST','rb')); [print(k+': '+str(p.get(k,'MISSING'))) for k in ['CFBundleExecutable','CFBundleIdentifier','CFBundleName','CFBundleDisplayName','CFBundleVersion','CFBundleShortVersionString']]"

          # 构建TIPA结构
          rm -rf tipa_build
          mkdir -p tipa_build/Payload
          cp -R "$APP_PATH" tipa_build/Payload/AppWiperUI.app
          echo "Payload structure:"
          ls -la tipa_build/Payload/AppWiperUI.app/
          test -f tipa_build/Payload/AppWiperUI.app/Info.plist && echo "Info.plist in Payload: YES" || echo "Info.plist in Payload: NO!"

          # 伪签名
          if command -v ldid &> /dev/null; then
            ENT="${{ github.workspace }}/App/entitlements.plist"
            echo "Signing with ldid..."
            if [ -f "$ENT" ]; then
              ldid -S"$ENT" tipa_build/Payload/AppWiperUI.app/AppWiperUI
            else
              ldid -S tipa_build/Payload/AppWiperUI.app/AppWiperUI
            fi
            echo "Signed"
            ldid -e tipa_build/Payload/AppWiperUI.app/AppWiperUI 2>&1 | head -15 || true
          else
            echo "WARNING: no ldid"
          fi

          # 打包
          cd tipa_build
          zip -r -X ../AppWiperUI-v2.08.tipa Payload
          cd ..
          echo "TIPA contents:"
          unzip -l AppWiperUI-v2.08.tipa
          ls -lh AppWiperUI-v2.08.tipa

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWiper-Rootless-DEB
          path: ${{ github.workspace }}/packages/*.deb

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWiperUI-TIPA
          path: ${{ github.workspace }}/AppWiperUI-v2.08.tipa

      - name: Commit packages to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p packages
          cp AppWiperUI-v2.08.tipa packages/ 2>/dev/null || true
          git add packages/*.deb packages/*.tipa || true
          if git diff --cached --quiet; then
            echo "No packages to commit"
          else
            git commit -m "CI: Auto-build AppWiper (deb + tipa) [skip ci]"
            git push
          fi
